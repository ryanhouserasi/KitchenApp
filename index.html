<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Place</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424; --surface3: #2e2e2e;
  --border: #2e2e2e; --border2: #3a3a3a;
  --accent: #e8c97a; --accent2: #4d8b6f; --danger: #c05050; --warn: #d97b3a;
  --text: #f0f0f0; --text2: #a0a0a0; --text3: #555;
  --radius: 12px; --radius-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; background: var(--bg); color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 15px;
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}

/* ── SCREENS ── */
.screen { display: none; flex-direction: column; height: 100%; }
.screen.active { display: flex; }

/* ── LOGIN ── */
/* FIX Bug10: min-height + auto height so small phones don't clip */
#login-screen { align-items: stretch; justify-content: flex-start; overflow-y: auto; height: auto; min-height: 100%; }
.login-hero {
  background: var(--surface); padding: 48px 24px 32px; text-align: center;
  border-bottom: 1px solid var(--border);
  padding-top: calc(48px + env(safe-area-inset-top, 0px));
}
.login-hero h1 { margin: 0 0 4px; font-size: 26px; font-weight: 600; color: var(--accent); letter-spacing: -0.5px; }
.login-hero p { margin: 0; font-size: 13px; color: var(--text3); font-family: 'DM Mono', monospace; }
.login-body { padding: 24px 20px; flex: 1; }
.login-body h2 { font-size: 14px; font-weight: 600; color: var(--text2); margin: 0 0 14px; letter-spacing: 0.3px; }
.location-btn {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 15px 16px; margin-bottom: 10px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
  cursor: pointer; text-align: left; transition: border-color .15s, background .15s;
}
.location-btn:active { background: var(--surface2); }
.location-btn .loc-addr { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 2px; }
.location-btn .chevron { color: var(--text3); font-size: 18px; }
.commissary-section { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 20px; }
.commissary-section h2 { font-size: 14px; font-weight: 600; color: var(--text2); margin: 0 0 14px; }
.pin-wrap { display: flex; gap: 10px; }
/* FIX Bug8: autocomplete="off" set in HTML */
.pin-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 13px 14px; color: var(--text);
  font-family: 'DM Mono', monospace; font-size: 18px; letter-spacing: 4px;
  outline: none; text-align: center;
}
.pin-input:focus { border-color: var(--accent); }
.pin-btn {
  background: var(--accent); color: #111; border: none; border-radius: var(--radius-sm);
  padding: 13px 20px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;
}
.pin-error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

/* ── APP SHELL ── */
#app-screen { overflow: hidden; }
#app-header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 16px 10px; flex-shrink: 0; display: flex;
  justify-content: space-between; align-items: center;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
}
.header-left h1 { margin: 0 0 2px; font-size: 16px; font-weight: 600; color: var(--accent); }
.header-left p { margin: 0; font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.logout-btn {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--text3); font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 5px 10px; cursor: pointer;
}
#tab-bar {
  display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; overflow-x: auto;
}
#tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 1; min-width: 70px; padding: 11px 4px; background: none; border: none;
  border-bottom: 2px solid transparent; color: var(--text3);
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap; transition: color .2s, border-color .2s;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn.hidden { display: none; }
/* FIX Bug9: overflow-x hidden to prevent horizontal scroll */
#tab-content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; position: relative; }

/* ── PANE ── */
.pane { display: none; }
.pane.active { display: block; }

/* ── TOOLBAR ── */
.toolbar {
  position: sticky; top: 0; z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--border); padding: 10px 14px;
  display: flex; gap: 8px; align-items: center;
}
.search-input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
}
.search-input:focus { border-color: var(--accent); }
.action-btn {
  background: var(--accent); color: #111; border: none; border-radius: var(--radius-sm);
  padding: 9px 14px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
.action-btn.green { background: var(--accent2); color: #fff; }
.action-btn.outline { background: none; border: 1px solid var(--border2); color: var(--text2); }
.action-btn.red { background: var(--danger); color: #fff; }

/* ── COUNTS ── */
.product-row { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); gap: 10px; }
.product-name { flex: 1; font-size: 14px; font-weight: 500; }
.count-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.count-val { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; }
.par-label { font-size: 11px; color: var(--text3); }
.par-low { color: var(--danger) !important; }
.par-ok { color: var(--accent2) !important; }
.editor-wrap { display: none; align-items: center; gap: 6px; }
.editor-wrap.on { display: flex; }
.count-input {
  width: 64px; background: var(--surface3); border: 1px solid var(--accent);
  border-radius: 6px; padding: 6px 8px; color: var(--text);
  font-family: 'DM Mono', monospace; font-size: 15px; text-align: center; outline: none;
}
.unit-tag { font-size: 12px; color: var(--text2); }
.static-wrap.gone { display: none; }

/* par settings */
.par-row { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); gap: 10px; }
.par-name { flex: 1; font-size: 14px; }
/* FIX Bug4: use data attributes for pars instead of IDs with spaces */
.par-field {
  width: 72px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 8px; color: var(--text);
  font-family: 'DM Mono', monospace; font-size: 14px; text-align: center; outline: none;
}
.par-field:focus { border-color: var(--accent); }

/* ── RECIPES ── */
.recipe-card { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.rc-header { display: flex; justify-content: space-between; align-items: flex-start; }
.rc-name { font-size: 15px; font-weight: 600; }
.rc-shift { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 2px; }
.rc-actions { display: flex; gap: 6px; margin-top: 8px; }
.rc-edit-btn {
  background: var(--surface3); border: 1px solid var(--border2); border-radius: 6px;
  padding: 5px 10px; color: var(--text2); font-family: 'DM Sans',sans-serif;
  font-size: 12px; font-weight: 500; cursor: pointer;
}
.recipe-detail { display: none; background: var(--surface2); margin: 0 12px 10px; border-radius: var(--radius-sm); padding: 12px; }
.recipe-detail.open { display: block; }
.detail-head { display: grid; grid-template-columns: 1fr 100px; font-size: 11px; color: var(--text3); font-weight: 600; margin-bottom: 6px; gap: 4px; }
.detail-row { display: grid; grid-template-columns: 1fr 100px; font-size: 13px; padding: 5px 0; border-top: 1px solid var(--border); gap: 4px; align-items: center; }
.detail-process { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border2); }
.detail-process-lbl { font-size: 11px; color: var(--text3); font-weight: 600; letter-spacing: .5px; margin-bottom: 6px; }
.detail-process-text { font-size: 13px; color: var(--text2); line-height: 1.6; white-space: pre-wrap; background: var(--surface3); border-radius: 6px; padding: 10px 12px; }

/* ── RECIPE EDITOR (commissary) ── */
.recipe-editor {
  background: var(--surface); border-radius: var(--radius); margin: 16px;
  border: 1px solid var(--border2); overflow: hidden;
}
.re-header {
  background: var(--surface2); padding: 14px 16px; display: flex;
  justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
}
.re-title { font-size: 15px; font-weight: 600; }
.re-body { padding: 16px; }
.re-section { font-size: 11px; color: var(--text3); font-weight: 600; letter-spacing: .5px; margin: 14px 0 8px; }
.re-row { display: grid; grid-template-columns: 1fr 120px 32px; gap: 6px; margin-bottom: 8px; align-items: center; }
.re-row-head { display: grid; grid-template-columns: 1fr 120px 32px; gap: 6px; margin-bottom: 4px; }
.re-process { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; resize: vertical; min-height: 100px; line-height: 1.6; }
.re-process:focus { border-color: var(--accent); }
.re-row-head span { font-size: 11px; color: var(--text3); font-weight: 600; }
.re-fi {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 10px; color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 13px; outline: none; width: 100%;
}
.re-fi:focus { border-color: var(--accent); }
.re-del-btn {
  background: none; border: none; color: var(--danger); font-size: 18px;
  cursor: pointer; padding: 0; line-height: 1; display: flex; align-items: center; justify-content: center;
}
.re-add-ing-btn {
  background: none; border: 1px dashed var(--border2); border-radius: 6px;
  color: var(--text3); font-size: 13px; padding: 8px; width: 100%; cursor: pointer;
  font-family: 'DM Sans', sans-serif; margin-top: 4px;
}
.re-add-ing-btn:active { background: var(--surface2); }
.re-footer { display: flex; gap: 10px; margin-top: 16px; }
.re-cancel { flex: 1; background: none; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 11px; color: var(--text2); font-family: 'DM Sans',sans-serif; font-size: 14px; cursor: pointer; }
.re-save { flex: 2; background: var(--accent2); color: #fff; border: none; border-radius: var(--radius-sm); padding: 11px; font-family: 'DM Sans',sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
.re-delete { background: var(--danger); color: #fff; border: none; border-radius: var(--radius-sm); padding: 11px 14px; font-family: 'DM Sans',sans-serif; font-size: 14px; cursor: pointer; }
.add-recipe-btn {
  display: block; width: calc(100% - 32px); margin: 16px; background: var(--surface2);
  border: 1px dashed var(--border2); border-radius: var(--radius-sm); padding: 13px;
  color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
  cursor: pointer; text-align: center;
}
.add-recipe-btn:active { background: var(--surface3); }
.recipe-custom-badge {
  font-size: 10px; background: var(--accent2); color: #fff; border-radius: 4px;
  padding: 1px 5px; margin-left: 6px; vertical-align: middle; font-family: 'DM Mono',monospace;
}

/* ── TEMP LOG ── */
.mode-strip {
  display: flex; gap: 8px; padding: 10px 14px; background: var(--surface);
  border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0;
}
.mode-strip::-webkit-scrollbar { display: none; }
.mode-pill {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 20px;
  padding: 7px 14px; color: var(--text2); font-size: 13px; font-weight: 500;
  cursor: pointer; white-space: nowrap;
}
.mode-pill.active { background: var(--accent); color: #111; border-color: var(--accent); }
.log-form { padding: 16px; }
.log-form h3 { margin: 0 0 14px; font-size: 12px; font-weight: 600; color: var(--text3); letter-spacing: .5px; }
.fg { margin-bottom: 14px; }
.fg label { display: block; font-size: 12px; color: var(--text2); font-weight: 500; margin-bottom: 5px; }
.fi, .fs {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 11px 12px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
}
.fi:focus, .fs:focus { border-color: var(--accent); }
.fs option { background: var(--surface2); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.submit-btn {
  width: 100%; background: var(--accent2); color: #fff; border: none;
  border-radius: var(--radius-sm); padding: 13px; font-family: 'DM Sans', sans-serif;
  font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px;
}
.submit-btn:active { opacity: .85; }

/* Cooling checkpoints */
.checkpoint-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  margin: 0 16px 12px; padding: 14px;
}
.cp-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.cp-name { font-size: 14px; font-weight: 600; }
.cp-date { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.cp-steps { display: flex; flex-direction: column; gap: 8px; }
.cp-step {
  display: flex; align-items: center; gap: 10px; background: var(--surface2);
  border-radius: var(--radius-sm); padding: 10px 12px;
}
.cp-step-label { font-size: 12px; color: var(--text2); font-weight: 500; width: 70px; flex-shrink: 0; }
.cp-step-content { flex: 1; }
.cp-logged { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 600; }
.cp-log-btn {
  background: var(--accent); color: #111; border: none; border-radius: 6px;
  padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.cp-log-btn.done { background: var(--surface3); color: var(--text3); cursor: default; }
.cp-due { font-size: 11px; color: var(--text3); margin-top: 2px; }
.temp-safe { color: var(--accent2); }
.temp-warn { color: var(--warn); }
.temp-danger { color: var(--danger); }

/* history */
.hist-entry {
  background: var(--surface); border-radius: var(--radius-sm); padding: 12px;
  margin: 10px 14px 0; border-left: 3px solid var(--accent2);
}
.hist-entry.recv { border-left-color: var(--accent); }
.hist-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
.hist-name { font-size: 14px; font-weight: 600; }
.hist-temp { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 600; }
.hist-meta { font-size: 12px; color: var(--text3); }
.export-bar { padding: 14px; display: flex; gap: 10px; }
.export-btn {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 11px; color: var(--text);
  font-size: 13px; font-weight: 500; cursor: pointer; text-align: center;
}

/* ── MODAL ── */
#modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
  z-index: 100; align-items: flex-end; justify-content: center;
}
#modal-overlay.open { display: flex; }
#modal-box {
  background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
  padding: 20px; width: 100%; max-width: 480px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
}
#modal-box h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
#modal-box p { margin: 0 0 16px; font-size: 13px; color: var(--text2); }
#modal-temp {
  width: 100%; background: var(--surface2); border: 1px solid var(--accent);
  border-radius: var(--radius-sm); padding: 14px; font-family: 'DM Mono', monospace;
  font-size: 22px; text-align: center; color: var(--text); outline: none; margin-bottom: 14px;
}
.modal-btns { display: flex; gap: 10px; }
.modal-cancel {
  flex: 1; background: none; border: 1px solid var(--border2); border-radius: var(--radius-sm);
  padding: 12px; color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 15px; cursor: pointer;
}
.modal-save {
  flex: 2; background: var(--accent2); color: #fff; border: none;
  border-radius: var(--radius-sm); padding: 12px;
  font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;
}

/* ── CONFIRM DIALOG ── */
#confirm-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
  z-index: 110; align-items: center; justify-content: center; padding: 20px;
}
#confirm-overlay.open { display: flex; }
#confirm-box {
  background: var(--surface); border-radius: var(--radius); padding: 24px;
  width: 100%; max-width: 360px;
}
#confirm-box h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
#confirm-box p { margin: 0 0 20px; font-size: 14px; color: var(--text2); }
.confirm-btns { display: flex; gap: 10px; }
.confirm-cancel {
  flex: 1; background: none; border: 1px solid var(--border2); border-radius: var(--radius-sm);
  padding: 11px; color: var(--text2); font-family: 'DM Sans',sans-serif; font-size: 14px; cursor: pointer;
}
.confirm-ok {
  flex: 2; background: var(--danger); color: #fff; border: none;
  border-radius: var(--radius-sm); padding: 11px;
  font-family: 'DM Sans',sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;
}

/* ── TOAST ── */
.toast {
  position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%;
  transform: translateX(-50%); background: var(--accent2); color: #fff;
  padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600;
  opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200; white-space: nowrap;
}
.toast.show { opacity: 1; }
.bottom-pad { height: 20px; }
.empty-state { padding: 40px 20px; text-align: center; color: var(--text3); font-size: 14px; }
.section-label { padding: 10px 16px 4px; font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; background: var(--bg); }
</style>
</head>
<body>

<!-- ═══════════════════════════ LOGIN ═══════════════════════════ -->
<div id="login-screen" class="screen active">
  <div class="login-hero">
    <h1>Kitchen Place</h1>
    <p>COMMISSARY OPERATIONS</p>
  </div>
  <div class="login-body">
    <h2>SELECT YOUR LOCATION</h2>
    <button class="location-btn" onclick="loginLocation('Miz La La West Adams')">
      <div><div>Miz La La West Adams</div><div class="loc-addr">5400 W Adams Blvd, LA</div></div>
      <span class="chevron">›</span>
    </button>
    <button class="location-btn" onclick="loginLocation('Miz La La Sherman Oaks')">
      <div><div>Miz La La Sherman Oaks</div><div class="loc-addr">4515 Sepulveda Blvd, LA</div></div>
      <span class="chevron">›</span>
    </button>
    <button class="location-btn" onclick="loginLocation('Miz La La Sycamore')">
      <div><div>Miz La La Sycamore</div><div class="loc-addr">Los Angeles, CA</div></div>
      <span class="chevron">›</span>
    </button>
    <button class="location-btn" onclick="loginLocation('Johnny\'s Pastrami West Adams')">
      <div><div>Johnny's Pastrami West Adams</div><div class="loc-addr">4327 W Adams Blvd, LA</div></div>
      <span class="chevron">›</span>
    </button>
    <button class="location-btn" onclick="loginLocation('Vicky\'s All Day')">
      <div><div>Vicky's All Day</div><div class="loc-addr">5410 W Adams Blvd, LA</div></div>
      <span class="chevron">›</span>
    </button>

    <div class="commissary-section">
      <h2>COMMISSARY / ADMIN</h2>
      <div class="pin-wrap">
        <!-- FIX Bug8: autocomplete="off" -->
        <input id="pin-input" class="pin-input" type="password" inputmode="numeric"
               maxlength="4" placeholder="PIN" autocomplete="off">
        <button class="pin-btn" onclick="loginCommissary()">Enter</button>
      </div>
      <div class="pin-error" id="pin-error">Incorrect PIN. Try again.</div>
    </div>
    <div class="bottom-pad"></div>
  </div>
</div>

<!-- ═══════════════════════════ APP ═══════════════════════════ -->
<div id="app-screen" class="screen">
  <div id="app-header">
    <div class="header-left">
      <h1 id="loc-name">Location</h1>
      <p id="loc-date"></p>
    </div>
    <button class="logout-btn" onclick="logout()">Switch ⇄</button>
  </div>
  <div id="tab-bar">
    <button class="tab-btn active" data-tab="counts" onclick="showTab('counts')">Counts</button>
    <button class="tab-btn" data-tab="recipes" onclick="showTab('recipes')">Recipes</button>
    <button class="tab-btn" data-tab="temp" onclick="showTab('temp')">Temp Log</button>
    <button class="tab-btn hidden" data-tab="pars" id="tab-pars" onclick="showTab('pars')">Set Pars</button>
  </div>

function lsKey(k) { return 'kp_' + (isCommissary ? 'commissary' : currentLocation) + '_' + k; }
function load(k, def) { try { const v = localStorage.getItem(lsKey(k)); return v !== null ? JSON.parse(v) : def; } catch(e) { return def; } }
function save(k, v) { try { localStorage.setItem(lsKey(k), JSON.stringify(v)); } catch(e) {} }

// ── FIREBASE LOG SYNC ──
// In-memory log cache — populated by Firestore real-time listener
let _logsCache = [];
let _fbUnsubscribe = null;

function startLogSync() {
  if (!window._fb) return;
  if (_fbUnsubscribe) _fbUnsubscribe(); // stop previous listener
  const q = window._fb.query(window._fb.collection('temp_logs'), window._fb.orderBy('timestamp', 'desc'));
  _fbUnsubscribe = window._fb.onSnapshot(q, (snapshot) => {
    _logsCache = snapshot.docs.map(d => ({ _docId: d.id, ...d.data() }));
    // Re-render if temp tab is active
    if (tempMode) renderTempBody();
  });
}

function loadLogs() { return _logsCache; }

async function saveLogs(logs) {
  // saveLogs is only called with a full array after adding/modifying an entry.
  // We find the new/changed entry and write it to Firestore.
  // For new entries (no _docId), add them. For updated entries, update by docId.
  if (!window._fb) {
    // Fallback: localStorage if Firebase not ready
    try { localStorage.setItem('kp_all_logs', JSON.stringify(logs)); } catch(e) {}
    _logsCache = logs;
    return;
  }
  for (const entry of logs) {
    if (!entry._docId) {
      // New entry — add to Firestore
      const { _docId, ...data } = entry;
      try { await window._fb.addDoc(window._fb.collection('temp_logs'), data); } catch(e) { console.error(e); }
    }
    // Updated entries are handled by updateLogEntry()
  }
}

async function updateLogEntry(docId, fields) {
  if (!window._fb || !docId) return;
  try {
    await window._fb.updateDoc(window._fb.doc('temp_logs', docId), fields);
  } catch(e) { console.error(e); }
}

function loadPars() { try { const v = localStorage.getItem('kp_global_pars'); return v ? JSON.parse(v) : {}; } catch(e) { return {}; } }
function saveParsGlobal(p) { try { localStorage.setItem('kp_global_pars', JSON.stringify(p)); } catch(e) {} }

function loadCustomRecipes() { try { const v = localStorage.getItem('kp_custom_recipes'); return v ? JSON.parse(v) : {}; } catch(e) { return {}; } }
function saveCustomRecipes(r) { try { localStorage.setItem('kp_custom_recipes', JSON.stringify(r)); } catch(e) {} }

// In-memory editor state (separate from DOM to avoid re-render losing focus)
let _editorIngs = [];

function startEditorState(name) {
  const RECIPES = getAllRecipes();
  const isNew = name === '';
  _editorIngs = isNew ? [{name:'',qty:''}]
    : JSON.parse(JSON.stringify(RECIPES[name].ingredients));
}

function updateEditorIng(i, field, val) {
  if (!_editorIngs[i]) return;
  _editorIngs[i][field] = field === 'cost' ? parseFloat(val)||0 : val;
}

function addEditorIng() {
  // Read current values from DOM before re-render
  syncEditorIngsFromDOM();
  _editorIngs.push({name:'',qty:''});
  redrawIngList();
}

function removeEditorIng(i) {
  syncEditorIngsFromDOM();
  _editorIngs.splice(i, 1);
  if (_editorIngs.length === 0) _editorIngs = [{name:'',qty:''}];
  redrawIngList();
}

function syncEditorIngsFromDOM() {
  const rows = document.querySelectorAll('#re-ing-list .re-row');
  rows.forEach(row => {
    const idx = parseInt(row.dataset.idx);
    const nameEl = row.querySelector('[data-field="name"]');
    const qtyEl = row.querySelector('[data-field="qty"]');
    if (nameEl) _editorIngs[idx] = {
      name: nameEl.value,
      qty: qtyEl ? qtyEl.value : ''
    };
  });
}

function redrawIngList() {
  const container = document.getElementById('re-ing-list');
  if (!container) return;
  container.innerHTML = _editorIngs.map((ing, i) => `
    <div class="re-row" data-idx="${i}">
      <input class="re-fi" type="text" placeholder="Ingredient" value="${(ing.name||'').replace(/"/g,'&quot;')}" data-field="name" data-idx="${i}" oninput="updateEditorIng(${i},'name',this.value)">
      <input class="re-fi" type="text" placeholder="Qty" value="${(ing.qty||'').replace(/"/g,'&quot;')}" data-field="qty" data-idx="${i}" oninput="updateEditorIng(${i},'qty',this.value)">
      <button class="re-del-btn" onclick="removeEditorIng(${i})" title="Remove">×</button>
    </div>`).join('');
}

// Called when recipe editor is first rendered
function initEditorState() {
  startEditorState(editingRecipeName);
}

function cancelEditRecipe() {
  editingRecipeName = null;
  _editorIngs = [];
  renderRecipes(document.querySelector('#pane-recipes .search-input').value);
}

function saveEditorRecipe(originalName, isNew) {
  // sync ingredients from DOM
  syncEditorIngsFromDOM();

  const nameEl = document.getElementById('re-name');
  const shiftEl = document.getElementById('re-shift');
  if (!nameEl || !shiftEl) return;

  const processEl = document.getElementById('re-process');
  const newName = nameEl.value.trim().toUpperCase();
  const shift = shiftEl.value;
  const process = processEl ? processEl.value.trim() : '';

  if (!newName) { toast('Enter a recipe name'); return; }
  if (_editorIngs.length === 0 || !_editorIngs.some(i => i.name.trim())) {
    toast('Add at least one ingredient'); return;
  }

  // Clean up blank ingredient rows
  const ingredients = _editorIngs.filter(i => i.name.trim() !== '');
  if (ingredients.length === 0) { toast('Add at least one ingredient'); return; }

  // If renaming, remove old entry
  if (!isNew && originalName && originalName !== newName) {
    delete customRecipes[originalName];
    // If it was a base recipe being "edited under a new name", old base stays untouched
  }

  customRecipes[newName] = { shift, ingredients, process };
  saveCustomRecipes(customRecipes);

  editingRecipeName = null;
  _editorIngs = [];
  toast((isNew ? 'Recipe added' : 'Recipe updated') + ' ✓');
  renderRecipes();
}

function confirmDeleteRecipe(name) {
  showConfirm(
    'Delete Recipe?',
    `"${name}" will be permanently removed.`,
    () => deleteRecipe(name)
  );
}

function deleteRecipe(name) {
  delete customRecipes[name];
  saveCustomRecipes(customRecipes);
  if (editingRecipeName === name) editingRecipeName = null;
  toast('Recipe deleted');
  renderRecipes();
}

    <div class="two-col">
      <div class="fg"><label>Cook Temp (°F)</label><input class="fi" id="prod-cook" type="number" placeholder="165"></div>
      <div class="fg"><label>Batch (bags)</label><input class="fi" id="prod-batch" type="number" placeholder="4"></div>
    </div>
    <div class="fg"><label>Notes</label><input class="fi" id="prod-notes" type="text" placeholder="Optional"></div>
    <button class="submit-btn" onclick="logProduction()">Start Cooling Log</button>
  </div>`;
}

async function logProduction() {
  const item = document.getElementById('prod-item').value;
  const cook = parseFloat(document.getElementById('prod-cook').value);
  const batch = document.getElementById('prod-batch').value;
  const notes = document.getElementById('prod-notes').value;
  const now = new Date();
  const entry = {
    id: Date.now(),
    type: 'production',
    location: 'Commissary',
    product: item,
    cookTemp: isNaN(cook) ? null : cook,
    batch: batch || null,
    notes: notes || null,
    bagged: { time: new Date(now.getTime()+15*60000).toISOString(), temp: null },
    check2h: { time: new Date(now.getTime()+2*3600000).toISOString(), temp: null },
    check6h: { time: new Date(now.getTime()+6*3600000).toISOString(), temp: null },
    timestamp: now.toISOString()
  };
  if (window._fb) {
    try { await window._fb.addDoc(window._fb.collection('temp_logs'), entry); } catch(e) { console.error(e); }
  } else {
    _logsCache.unshift(entry);
  }
  scheduleNotification(item, 2, entry.id);
  scheduleNotification(item, 6, entry.id);
  toast('Production logged — cooling checkpoints set');
  setMode('cooling');
}

function scheduleNotification(product, hours, id) {
  if (!('Notification' in window)) return;
  const ms = hours * 3600000;
  Notification.requestPermission().then(perm => {
    if (perm === 'granted') {
      setTimeout(() => {
        new Notification('🌡️ Cooling Check', {
          body: `${product} — ${hours}hr temp check due now`,
          tag: `cp-${id}-${hours}`
        });
      }, ms);
    }
  });
}

function coolingLog() {
  const logs = loadLogs().filter(e => e.type === 'production' && e.location === 'Commissary');
  if (!logs.length) return '<div class="empty-state">No active cooling logs.<br>Start a production entry first.</div>';
  const recent = logs.slice(0, 15);
  return '<div style="padding:12px 0">' + recent.map(e => {
    const steps = [
      {key:'bagged', label:'Bagged', targetTime: e.bagged?.time},
      {key:'check2h', label:'2 Hr', targetTime: e.check2h?.time},
      {key:'check6h', label:'6 Hr', targetTime: e.check6h?.time}
    ];
    const dt = new Date(e.timestamp);
    return `<div class="checkpoint-card">
      <div class="cp-header">
        <div><div class="cp-name">${e.product}</div><div class="cp-date">${fmtDT(dt)}${e.batch?' · '+e.batch+' bags':''}</div></div>
        ${e.cookTemp ? `<div class="cp-logged ${tempClass(e.cookTemp,'cook')}">${e.cookTemp}°F cook</div>` : ''}
      </div>
      <div class="cp-steps">
        ${steps.map(s => {
          const logged = e[s.key]?.temp !== null && e[s.key]?.temp !== undefined;
          const temp = e[s.key]?.temp;
          const due = new Date(s.targetTime);
          const overdue = !logged && new Date() > due;
          // FIX Bug2/3: register callback in _cpCallbacks instead of inline function string
          const cbKey = `${e.id}_${s.key}`;
          if (!logged) {
            _cpCallbacks[cbKey] = (t) => logCheckpoint(e.id, s.key, t);
          }
          return `<div class="cp-step">
            <div class="cp-step-label">${s.label}</div>
            <div class="cp-step-content">
              ${logged
                ? `<div class="cp-logged ${tempClass(temp,'cool')}">${temp}°F</div><div class="cp-due">${fmtDT(due)}</div>`
                : `<div class="cp-due ${overdue?'temp-danger':''}">Due ${fmtDT(due)}</div>`}
            </div>
            ${!logged
              ? `<button class="cp-log-btn" onclick="openModal('Log ${s.label} Temp','${e.product} — ${fmtDT(due)}',_cpCallbacks['${cbKey}'])">Log °F</button>`
              : `<button class="cp-log-btn done">✓</button>`}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('') + '</div>';
}

async function logCheckpoint(id, key, temp) {
  const entry = _logsCache.find(e => e.id === id);
  if (entry) {
    if (entry._docId && window._fb) {
      await updateLogEntry(entry._docId, { [key]: { time: entry[key].time, temp } });
    } else {
      entry[key].temp = temp;
    }
  }
  toast('Temp logged ✓');
  renderTempBody();
}

function receivingForm() {
  return `<div class="log-form">
    <h3>LOG RECEIVED PRODUCT</h3>
    <div class="fg"><label>Product</label>
      <select class="fs" id="recv-item">${PRODUCTS.map(p=>`<option>${p}</option>`).join('')}</select></div>
    <div class="two-col">
      <div class="fg"><label>Received Temp (°F)</label><input class="fi" id="recv-temp" type="number" placeholder="38"></div>
      <div class="fg"><label>Qty (bags)</label><input class="fi" id="recv-qty" type="number" placeholder="2"></div>
    </div>
    <div class="fg"><label>Received By</label><input class="fi" id="recv-by" type="text" placeholder="Name"></div>
    <div class="fg"><label>Notes</label><input class="fi" id="recv-notes" type="text" placeholder="Optional"></div>
    <button class="submit-btn" onclick="logReceiving()">Log Entry</button>
  </div>`;
}

async function logReceiving() {
  const item = document.getElementById('recv-item').value;
  const temp = parseFloat(document.getElementById('recv-temp').value);
  const qty = document.getElementById('recv-qty').value;
  const by = document.getElementById('recv-by').value;
  const notes = document.getElementById('recv-notes').value;

  if (!by.trim()) { toast('Enter your name'); return; }

  const entry = {
    id: Date.now(),
    type: 'receiving',
    location: currentLocation,
    product: item,
    temp: isNaN(temp) ? null : temp,
    qty: qty || null,
    receivedBy: by || null,
    notes: notes || null,
    timestamp: new Date().toISOString()
  };

  if (window._fb) {
    try { await window._fb.addDoc(window._fb.collection('temp_logs'), entry); } catch(e) { console.error(e); }
  } else {
    _logsCache.unshift(entry);
  }
  toast('Receiving log saved ✓');
  renderTempBody();
}

function historyView() {
  const allLogs = loadLogs();
  const logs = isCommissary ? allLogs : allLogs.filter(e => e.location === currentLocation);
  const html = `<div class="export-bar">
    <button class="export-btn" onclick="exportXLSX()">⬇ Download .xlsx</button>
  </div>` + (logs.length === 0 ? '<div class="empty-state">No entries yet.</div>' :
    logs.slice(0, 60).map(e => {
      if (e.type === 'production') {
        const stages = [
          // FIX Bug7: use != null so temp 0 is shown
          e.bagged?.temp != null ? `Bagged ${e.bagged.temp}°F` : null,
          e.check2h?.temp != null ? `2hr ${e.check2h.temp}°F` : null,
          e.check6h?.temp != null ? `6hr ${e.check6h.temp}°F` : null
        ].filter(Boolean).join(' · ');
        return `<div class="hist-entry">
          <div class="hist-header">
            <div><div class="hist-name">${e.product}</div><div class="hist-meta">Commissary · ${fmtDT(new Date(e.timestamp))}</div></div>
            ${e.cookTemp != null ? `<div class="hist-temp ${tempClass(e.cookTemp,'cook')}">${e.cookTemp}°F</div>` : ''}
          </div>
          ${stages ? `<div class="hist-meta" style="margin-top:4px">${stages}</div>` : ''}
        </div>`;
      } else {
        return `<div class="hist-entry recv">
          <div class="hist-header">
            <div><div class="hist-name">${e.product}</div><div class="hist-meta">${e.location} · ${fmtDT(new Date(e.timestamp))}${e.receivedBy?' · '+e.receivedBy:''}</div></div>
            ${e.temp != null ? `<div class="hist-temp ${tempClass(e.temp,'cool')}">${e.temp}°F</div>` : ''}
          </div>
          ${e.qty ? `<div class="hist-meta">${e.qty} bags${e.notes?' · '+e.notes:''}</div>` : ''}
        </div>`;
      }
    }).join(''));
  return html + '<div class="bottom-pad"></div>';
}

// ══════════════════════════════════════════════════════════
//  SET PARS (commissary only)
// ══════════════════════════════════════════════════════════
// FIX Bug4: use data-product attribute instead of ID with spaces
function renderPars(filter = '') {
  const pars = loadPars();
  const items = PRODUCTS.filter(p => p.toLowerCase().includes(filter.toLowerCase()));
  document.getElementById('par-list').innerHTML = items.map(p =>
    `<div class="par-row">
      <div class="par-name">${p}</div>
      <input class="par-field" data-product="${p.replace(/"/g,'&quot;')}" type="number" min="0" placeholder="—" value="${pars[p] !== undefined ? pars[p] : ''}">
    </div>`
  ).join('') + '<div class="bottom-pad"></div>';
}

function filterPars(v) { renderPars(v); }

function savePars() {
  const pars = loadPars();
  // FIX Bug4: query by data attribute instead of ID
  document.querySelectorAll('#par-list .par-field').forEach(el => {
    const p = el.dataset.product;
    const n = parseFloat(el.value);
    if (!isNaN(n) && n >= 0) pars[p] = n; else delete pars[p];
  });
  saveParsGlobal(pars);
  toast('Par levels saved ✓');
}

// ══════════════════════════════════════════════════════════
//  TEMP INPUT MODAL
// ══════════════════════════════════════════════════════════
function openModal(title, sub, cb) {
  modalCallback = cb;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-sub').textContent = sub;
  document.getElementById('modal-temp').value = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-temp').focus(), 100);
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); modalCallback = null; }
function saveModalTemp() {
  const v = parseFloat(document.getElementById('modal-temp').value);
  if (isNaN(v)) { toast('Enter a temperature'); return; }
  if (modalCallback) modalCallback(v);
  closeModal();
}
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.getElementById('modal-temp').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveModalTemp();
});

// ══════════════════════════════════════════════════════════
//  CONFIRM DIALOG
// ══════════════════════════════════════════════════════════
let _confirmCallback = null;
function showConfirm(title, msg, cb) {
  _confirmCallback = cb;
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-overlay').classList.add('open');
}
function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('open'); _confirmCallback = null; }
document.getElementById('confirm-ok-btn').addEventListener('click', () => {
  if (_confirmCallback) _confirmCallback();
  closeConfirm();
});

// ══════════════════════════════════════════════════════════
//  EXPORT
// ══════════════════════════════════════════════════════════
function exportXLSX() {
  const allLogs = loadLogs();
  const wb = XLSX.utils.book_new();
  // Production sheet
  const prod = [['Date','Time','Product','Cook Temp (°F)','Bagged Temp (°F)','2hr Temp (°F)','6hr Temp (°F)','Batch (bags)','Notes']];
  allLogs.filter(e=>e.type==='production').forEach(e=>{
    const dt=new Date(e.timestamp);
    // FIX Bug7: use != null so 0 temp exports correctly
    prod.push([
      dt.toLocaleDateString('en-US'),
      dt.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),
      e.product,
      e.cookTemp != null ? e.cookTemp : '',
      e.bagged?.temp != null ? e.bagged.temp : '',
      e.check2h?.temp != null ? e.check2h.temp : '',
      e.check6h?.temp != null ? e.check6h.temp : '',
      e.batch||'',
      e.notes||''
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(prod), 'Commissary Production');
  // One sheet per location
  LOCATIONS.forEach(loc => {
    const rows = [['Date','Time','Product','Received Temp (°F)','Qty (bags)','Received By','Notes']];
    allLogs.filter(e=>e.type==='receiving'&&e.location===loc).forEach(e=>{
      const dt=new Date(e.timestamp);
      rows.push([
        dt.toLocaleDateString('en-US'),
        dt.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),
        e.product,
        e.temp != null ? e.temp : '',
        e.qty||'',
        e.receivedBy||'',
        e.notes||''
      ]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), loc.substring(0,31));
  });
  XLSX.writeFile(wb, `TempLog_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Downloaded ✓');
}

// ══════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════
function tempClass(t, type) {
  if (type==='cook') return t>=165?'temp-safe':t>=145?'temp-warn':'temp-danger';
  return t<=41?'temp-safe':t<=45?'temp-warn':'temp-danger';
}
function fmtDT(d) {
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
function toast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ══════════════════════════════════════════════════════════
//  RECIPE EDITOR — init state after render
//  We monkey-patch the renderRecipes call so after innerHTML is set
//  for the editor view, _editorIngs is initialized
// ══════════════════════════════════════════════════════════
const _patchedRender = renderRecipes;
// After renderRecipes sets editor HTML, initEditorState runs:
// We do this cleanly by calling initEditorState at the end of recipeEditorHTML processing.
// The recipeEditorHTML function already populates _editorIngs based on the recipe data —
// we initialize _editorIngs explicitly here:

// Override renderRecipes to also init _editorIngs when showing editor
const _rrOrig = window.renderRecipes;
window.renderRecipes = function(filter = '') {
  const RECIPES = getAllRecipes();
  const list = document.getElementById('recipe-list');
  if (!list) return;

  if (editingRecipeName !== null) {
    // init editor state
    const isNew = editingRecipeName === '';
    _editorIngs = isNew
      ? [{name:'',qty:''}]
      : JSON.parse(JSON.stringify(RECIPES[editingRecipeName]?.ingredients || [{name:'',qty:''}]));
    list.innerHTML = recipeEditorHTML(editingRecipeName);
    return;
  }

  const keys = Object.keys(RECIPES).filter(k => !filter || k.toLowerCase().includes(filter.toLowerCase()));
  const html = keys.map(name => {
    const r = RECIPES[name];
    const isCustom = customRecipes.hasOwnProperty(name);
    const rdId = 'rd-' + name.replace(/[^a-zA-Z0-9]/g, '_');
    return `<div>
      <div class="recipe-card" onclick="toggleRecipe('${name.replace(/'/g,"\\'").replace(/\\/g,'\\\\').replace(/"/g,'&quot;')}')">
        <div class="rc-header">
          <div>
            <div class="rc-name">${name}${isCustom ? '<span class="recipe-custom-badge">CUSTOM</span>' : ''}</div>
            <div class="rc-shift">${r.shift} SHIFT</div>
          </div>
        </div>
        ${isCommissary ? `<div class="rc-actions" onclick="event.stopPropagation()">
          <button class="rc-edit-btn" onclick="startEditRecipe('${name.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">✎ Edit</button>
          ${isCustom ? `<button class="rc-edit-btn" style="color:var(--danger)" onclick="confirmDeleteRecipe('${name.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')">✕ Delete</button>` : ''}
        </div>` : ''}
      </div>
      <div class="recipe-detail" id="${rdId}">
        <div class="detail-head"><span>Ingredient</span><span>Qty</span></div>
        ${r.ingredients.map(i => `<div class="detail-row">
          <span>${i.name}</span>
          <span style="font-family:'DM Mono',monospace;color:var(--text2)">${i.qty}</span>
        </div>`).join('')}
        ${r.process ? `<div class="detail-process">
          <div class="detail-process-lbl">PROCESS & NOTES</div>
          <div class="detail-process-text">${r.process.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
        </div>` : ''}
      </div>
    </div>`;
  }).join('');

  list.innerHTML = html + (isCommissary ? `<button class="add-recipe-btn" onclick="startNewRecipe()">+ Add New Recipe</button>` : '') + '<div class="bottom-pad"></div>';
};
